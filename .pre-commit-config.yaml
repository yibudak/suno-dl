# See https://pre-commit.com for the full list of hooks and options.
# Install once:  pre-commit install --install-hooks
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
      - id: mypy
        files: ^suno_dl\.py$
        additional_dependencies: []

  - repo: local
    hooks:
      - id: pytest
        name: pytest (offline suite)
        entry: python -m pytest -q
        language: python
        additional_dependencies: ["pytest>=8"]
        pass_filenames: false
        always_run: true
        stages: [pre-push]
