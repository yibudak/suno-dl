name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1.2"
      - run: python -m build
      - name: check the tag matches the version
        run: |
          python - <<'PY'
          import pathlib, re, sys, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          source = pathlib.Path("suno_dl.py").read_text()
          module_version = re.search(r'__version__ = "([^"]+)"', source).group(1)
          tag = "${{ github.ref_name }}".lstrip("v")
          print(f"tag={tag} project={version} module={module_version}")
          sys.exit(0 if tag == version == module_version else 1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    name: attach artifacts to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Publishing needs a Trusted Publisher configured for this repository on PyPI
  # (pypi.org -> Your projects -> Publishing) and an environment named "pypi".
  # Delete this job if you only ship from GitHub Releases.
  pypi:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/suno-dl
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
